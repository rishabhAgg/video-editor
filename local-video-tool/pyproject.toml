[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-tool"
version = "0.1.0"
description = "Local-first HDR gameplay editing toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
editor = ["PySide6-Essentials>=6.8", "opencv-python-headless>=4.10,<5", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
video-tool = "video_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_tool = ["defaults/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
